project:
  seed: 42

paths:
  raw_dataset: MASAQ.csv
  cleaned_dataset: morphological_descriptions_cleaned.csv
  split_dir: data_ready
  train_csv: data_ready/train.csv
  val_csv: data_ready/val.csv
  test_csv: data_ready/test.csv
  legacy_test_csv: morph_test.csv
  training_output_dir: arabart_morph_model
  trained_model_dir: trained_arabart_morph_model

model:
  pretrained_name: moussaKam/AraBART
  max_input_length: 64
  max_target_length: 128
  num_beams: 4

training:
  learning_rate: 3e-5
  warmup_steps: 300
  train_batch_size: 16
  eval_batch_size: 2
  weight_decay: 0.01
  num_train_epochs: 6
  save_total_limit: 2
  early_stopping_patience: 2
  logging_steps: 20
